# Tenant Management System — app + Postgres for a single VPS.
# Usage:
#   1. Set AUTH_SECRET (and other secrets) in a .env file or your shell.
#   2. docker compose up -d --build
#   3. App on http://localhost:3000  (put Caddy/Nginx in front for TLS).

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: tms
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tms}
      POSTGRES_DB: tms
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tms -d tms"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: create/update schema and seed demo users, then exit.
  migrate:
    build:
      context: .
      target: builder
    command: sh -c "npx prisma db push --skip-generate && npx prisma db seed"
    environment:
      DATABASE_URL: postgresql://tms:${POSTGRES_PASSWORD:-tms}@db:5432/tms?schema=public
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    build:
      context: .
      target: runner
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://tms:${POSTGRES_PASSWORD:-tms}@db:5432/tms?schema=public
      AUTH_SECRET: ${AUTH_SECRET:-dev-only-secret-change-me-please-0123456789}
      AUTH_TRUST_HOST: "true"
      NODE_ENV: production
    ports:
      - "3000:3000"
    volumes:
      - file_storage:/app/storage
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  db_data:
  file_storage:
